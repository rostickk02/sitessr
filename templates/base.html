<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIDOROV — Кофейня{% endblock %}</title>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Шапка -->
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo">SIDOROV</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Главная</a></li>
            <li><a href="{{ url_for('portfolio') }}">Меню</a></li>
            <li><a href="{{ url_for('about') }}">О нас</a></li>
            <li><a href="{{ url_for('contact') }}">Контакты</a></li>
        </ul>
        <a href="{{ url_for('contact') }}" class="btn-order">Заказать <i class="fa-solid fa-mug-hot"></i></a>
    </nav>

    <!-- Основной контент страницы -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer>
        <div>
            <div class="footer-logo">SIDOROV</div>
            <p>КОФЕЙНЯ</p>
        </div>
        <div>
            <p>📍 ул. Рябиновая, 42</p>
            <p>🕒 Пн-Вс: 08:00 – 22:00</p>
        </div>
        <div>
            <p>📞 +7 (902) 049-50-60</p>
            <p>📷 @sidorov.coffee</p>
        </div>
    </footer>

</body>
</html>
