<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIDOROV — Кофейня{% endblock %}</title>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Новые стили атмосферного фона -->
    <style>
        :root {
            --bg-main: #0a0b0d;
            --bg-card: rgba(22, 24, 29, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main) !important;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;

            /* Атмосферный фон с кофейно-золотистыми мягкими бликами */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(180, 130, 60, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 65%, rgba(120, 75, 25, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(200, 150, 80, 0.1) 0%, transparent 55%) !important;
            background-attachment: fixed !important;
        }

        /* Эффект матового стекла (Glassmorphism) для карточек */
        div[style*="background: var(--bg-card)"],
        div[style*="background: #1a1c20"],
        .feature-card {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo">SIDOROV</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Главная</a></li>
            <li><a href="{{ url_for('portfolio') }}">Меню</a></li>
            <li><a href="{{ url_for('about') }}">О нас</a></li>
            <li><a href="{{ url_for('contact') }}">Контакты</a></li>
        </ul>
        <a href="{{ url_for('contact') }}" class="btn-order">Заказать <i class="fa-solid fa-mug-hot"></i></a>
    </nav>

    <!-- Основной контент страницы -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer>
        <div>
            <div class="footer-logo">SIDOROV</div>
            <p>КОФЕЙНЯ</p>
        </div>
        <div>
            <p>📍 ул. Рябиновая, 42</p>
            <p>🕒 Пн-Вс: 08:00 – 22:00</p>
        </div>
        <div>
            <p>📞 +7 (902) 049-50-60</p>
            <p>📷 @sidorov.coffee</p>
        </div>
    </footer>

</body>
</html>
