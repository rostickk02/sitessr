<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIDOROV — Кофейня{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Вшитые стили для модального окна (чтобы ничего не «плыло») -->
    <style>
        /* Скрытие и базовые стили для модального окна */
        .modal-overlay {
            display: none; /* Скрываем по умолчанию */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Показываем окно при добавлении класса active */
        .modal-overlay.active {
            display: flex !important;
        }

        .modal-content {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: #fff;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: #facc15;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .cart-items-list {
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .cart-summary strong {
            color: #facc15;
            font-size: 22px;
        }

        /* Стилизация формы внутри модального окна */
        .takeaway-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group-custom {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group-custom label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group-custom input {
            width: 100%;
            padding: 12px 14px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            color-scheme: dark;
        }

        .form-group-custom input:focus {
            border-color: #facc15;
        }

        .btn-submit {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: #facc15;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #eab308;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV Logo" class="nav-logo-img">
        </a>

        <ul class="nav-links">
            <li><a href="{{ url_for('about') }}">О кофейне</a></li>
            <li><a href="{{ url_for('portfolio') }}">Меню</a></li>
            <li><a href="{{ url_for('contact') }}">Контакты</a></li>
        </ul>

        <div class="nav-actions">
            <a href="#" class="icon-btn" title="Поиск"><i class="fa-solid fa-magnifying-glass"></i></a>
            
            <!-- Кнопка корзины со счетчиком -->
            <button type="button" class="icon-btn cart-btn" onclick="toggleCartModal()" title="Корзина">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
            </button>
            
            <a href="{{ url_for('contact') }}" class="btn-book">Забронировать</a>
        </div>
    </nav>

    <!-- Основной контент -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Модальное окно корзины (Take Away) -->
    <div id="cart-modal" class="modal-overlay" onclick="if(event.target === this) toggleCartModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ваш предзаказ (Take Away)</h2>
                <button type="button" class="modal-close" onclick="toggleCartModal()">&times;</button>
            </div>

            <div id="cart-items-list" class="cart-items-list">
                <!-- Сюда JS выводит список добавленных позиций -->
            </div>

            <div class="cart-summary">
                <span>Итого к оплате:</span>
                <strong id="cart-total-price">0 ₽</strong>
            </div>

            <!-- Форма оформления заказа -->
            <form action="{{ url_for('create_takeaway_order') }}" method="POST" class="takeaway-form">
                <input type="hidden" name="cart_data" id="cart-items-json">

                <div class="form-group-custom">
                    <label for="customer_name">Имя</label>
                    <input type="text" id="customer_name" name="customer_name" placeholder="Как к вам обращаться?" required>
                </div>

                <div class="form-group-custom">
                    <label for="customer_phone">Телефон</label>
                    <input type="tel" id="customer_phone" name="customer_phone" placeholder="+7 (999) 000-00-00" required>
                </div>

                <div class="form-group-custom">
                    <label for="pickup_time">Время самовывоза</label>
                    <input type="time" id="pickup_time" name="pickup_time" required>
                </div>

                <div class="form-group-custom">
                    <label for="comment">Комментарий к заказу</label>
                    <input type="text" id="comment" name="comment" placeholder="Например: овсяное молоко, без сахара">
                </div>

                <button type="submit" class="btn-submit" onclick="localStorage.removeItem('sidorov_cart')">
                    Оформить предзаказ
                </button>
            </form>
        </div>
    </div>

    <!-- Подвал -->
    <footer>
        <div class="footer-logo-wrap">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV" class="footer-logo-img">
        </div>
        <div>
            <p>📍 ул. Рябиновая, 42</p>
            <p>🕒 Пн-Вс: 08:00 – 22:00</p>
        </div>
        <div>
            <p>📞 +7 (902) 049-50-60</p>
            <p>📷 @sidorov.coffee</p>
        </div>
    </footer>

    <!-- JS функция открытия/закрытия окна -->
    <script>
        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('active');
        }
    </script>
    
    <!-- Подключение JS-скрипта корзины -->
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</body>
</html>
