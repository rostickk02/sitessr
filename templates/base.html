<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIDOROV — Кофейня{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Шапка -->
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV Logo" class="nav-logo-img">
        </a>

        <ul class="nav-links">
            <li><a href="{{ url_for('about') }}">О кофейне</a></li>
            <li><a href="{{ url_for('portfolio') }}">Меню</a></li>
            <li><a href="{{ url_for('contact') }}">Контакты</a></li>
        </ul>

        <div class="nav-actions">
            <a href="#" class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="#" class="icon-btn"><i class="fa-solid fa-bag-shopping"></i></a>
            <a href="{{ url_for('contact') }}" class="btn-book">Забронировать</a>
        </div>
    </nav>

    <!-- Основной контент -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer>
        <div class="footer-logo-wrap">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV" class="footer-logo-img">
        </div>
        <div>
            <p>📍 ул. Рябиновая, 42</p>
            <p>🕒 Пн-Вс: 08:00 – 22:00</p>
        </div>
        <div>
            <p>📞 +7 (902) 049-50-60</p>
            <p>📷 @sidorov.coffee</p>
        </div>
    </footer>

</body>
</html>
