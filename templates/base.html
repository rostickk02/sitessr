<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIDOROV — Кофейня{% endblock %}</title>
    
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Стили библиотеки AOS (Анимации при скролле) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Основные стили проекта -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Вшитые стили для модального окна и анимации -->
    <style>
        /* Стилизация кнопки корзины в шапке */
        .btn-cart-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            color: #fff;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cart-nav:hover {
            border-color: #facc15;
            color: #facc15;
            background: rgba(250, 204, 21, 0.05);
        }

        .cart-count-badge {
            background: #facc15;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            border-radius: 50%;
            padding: 2px 6px;
            line-height: 1;
        }

        /* ----------------------------------------------------------------- */
        /*   Анимации и стили модального окна                                */
        /* ----------------------------------------------------------------- */
        
        .modal-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;

            /* Начальное состояние для плавного появления */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                        visibility 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Показываем подложку */
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-content {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: #fff;
            position: relative;

            /* Начальное положение для эффекта «всплытия» и увеличение размера */
            transform: translateY(30px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Анимируем само окно при открытии */
        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: #facc15;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .cart-items-list {
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .cart-summary strong {
            color: #facc15;
            font-size: 22px;
        }

        .takeaway-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group-custom {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group-custom label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group-custom input {
            width: 100%;
            padding: 12px 14px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            color-scheme: dark;
            transition: border-color 0.2s;
        }

        .form-group-custom input:focus {
            border-color: #facc15;
        }

        .btn-submit {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: #facc15;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background: #eab308;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV Logo" class="nav-logo-img">
        </a>

        <ul class="nav-links">
            <li><a href="{{ url_for('about') }}">О кофейне</a></li>
            <li><a href="{{ url_for('portfolio') }}">Меню</a></li>
            <li><a href="{{ url_for('contact') }}">Контакты</a></li>
        </ul>

        <div class="nav-actions">
            <!-- Кнопка Корзины -->
            <button type="button" class="btn-cart-nav" onclick="toggleCartModal()">
                <i class="fa-solid fa-bag-shopping"></i>
                Корзина
                <span id="cart-badge" class="cart-count-badge" style="display: none;">0</span>
            </button>
        </div>
    </nav>

    <!-- Основной контент -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Модальное окно корзины (Take Away) -->
    <div id="cart-modal" class="modal-overlay" onclick="if(event.target === this) toggleCartModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ваш предзаказ (Take Away)</h2>
                <button type="button" class="modal-close" onclick="toggleCartModal()">&times;</button>
            </div>

            <div id="cart-items-list" class="cart-items-list">
                <!-- Сюда JS выводит список добавленных позиций -->
            </div>

            <div class="cart-summary">
                <span>Итого к оплате:</span>
                <strong id="cart-total-price">0 ₽</strong>
            </div>

            <!-- Форма оформления заказа -->
            <form action="{{ url_for('create_takeaway_order') }}" method="POST" class="takeaway-form">
                <input type="hidden" name="cart_data" id="cart-items-json">

                <div class="form-group-custom">
                    <label for="customer_name">Имя</label>
                    <input type="text" id="customer_name" name="customer_name" placeholder="Как к вам обращаться?" required>
                </div>

                <div class="form-group-custom">
                    <label for="customer_phone">Телефон</label>
                    <input type="tel" id="customer_phone" name="customer_phone" placeholder="+7 (999) 000-00-00" required>
                </div>

                <div class="form-group-custom">
                    <label for="pickup_time">Время самовывоза</label>
                    <input type="time" id="pickup_time" name="pickup_time" required>
                </div>

                <div class="form-group-custom">
                    <label for="comment">Комментарий к заказу</label>
                    <input type="text" id="comment" name="comment" placeholder="Например: овсяное молоко, без сахара">
                </div>

                <button type="submit" class="btn-submit" onclick="localStorage.removeItem('sidorov_cart')">
                    Оформить предзаказ
                </button>
            </form>
        </div>
    </div>

    <!-- Подвал -->
    <footer>
        <div class="footer-logo-wrap">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV" class="footer-logo-img">
        </div>
        <div>
            <p>📍 ул. Рябиновая, 42</p>
            <p>🕒 Пн-Вс: 08:00 – 22:00</p>
        </div>
        <div>
            <p>📞 +7 (902) 049-50-60</p>
            <p>📷 @sidorov.coffee</p>
        </div>
    </footer>

    <!-- JS функция открытия/закрытия окна -->
    <script>
        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('active');
        }
    </script>
    
    <!-- Подключение JS-скрипта корзины -->
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>

    <!-- Скрипт инициализации AOS (Анимации при скролле) -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
            offset: 100,
            easing: 'ease-out'
        });
    </script>
</body>
</html>
