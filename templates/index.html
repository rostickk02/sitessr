{% extends 'base.html' %}

{% block title %}SIDOROV — Хороший кофе в лучшее время{% endblock %}

{% block content %}
<!-- Hero Section -->
<section class="hero-banner">
    <div class="hero-content">
        <h1 class="hero-title">
            Хороший<br>кофе —<br>в лучшее<br>время
        </h1>
        <p class="hero-description">
            SIDOROV — это место, где вкус, атмосфера и люди создают особенное настроение.
        </p>
        <a href="{{ url_for('portfolio') }}" class="btn-white">
            Перейти в меню <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>
</section>

<!-- Нижняя плашка -->
<section class="bottom-bar">
    <div class="bottom-bar-logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="SIDOROV Coffee">
    </div>
    <div class="bottom-bar-text">
        Больше, чем просто кофе
    </div>
</section>
{% endblock %}
