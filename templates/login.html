{% extends 'base.html' %}

{% block title %}Вход в систему — SIDOROV{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <span class="login-subtitle">Авторизация</span>
            <h1 class="login-title">Вход в админку</h1>
        </div>

        {% if get_flashed_messages() %}
            <div class="login-alert">
                {% for message in get_flashed_messages() %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="login-form">
            <div class="form-group-custom">
                <label for="username">Логин</label>
                <div class="input-icon-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Введите логин" required autocomplete="off">
                </div>
            </div>

            <div class="form-group-custom">
                <label for="password">Пароль</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login-submit">
                <span>Войти в систему</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
